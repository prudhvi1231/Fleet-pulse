version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      - PORT=4000
      - SECONDARY_PORT=4001
    networks:
      - pulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - pulse-net

networks:
  pulse-net:
    driver: bridge
